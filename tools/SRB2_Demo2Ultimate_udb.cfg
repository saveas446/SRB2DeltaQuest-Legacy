/*************************************************************\
  Doom Builder 2 Game Configuration for SRB2 Demo 1
\*************************************************************/

// This is required to prevent accidental use of a different configuration
type = "Doom Builder 2 Game Configuration";

// This is the title to show for this game
game = "SRB2: Demo 2 Ultimate (Doom format)";

engine = "doomlegacy";

// Should this configuration be initially available?
enabledbydefault = true;

// Some common settings
include("Includes\\Common.cfg");


testparameters = " -skill \"%S\" -file \"%AP\" \"%F\" -warp %L1%L2 %NM";
testshortpaths = true;

// Default nodebuilder configurations
defaultsavecompiler = "zennode_normal";
defaulttestcompiler = "zennode_fast";

// Texture loading options
mixtexturesflats = false;
defaulttexturescale = 1.0f;
defaultflatscale = 1.0f;
scaledtextureoffsets = true;

//mxd. Do vanilla-style thing rotation angle clamping
doomthingrotationangles = true;
  
// Texture sources
textures
{
  include("Includes\\Doom_misc.cfg", "textures");
}

// Patch sources
patches
{
  include("Includes\\Doom_misc.cfg", "patches");
}

// Sprite sources
sprites
{
  include("Includes\\Doom_misc.cfg", "sprites");
}

// Flat sources
flats
{
  include("Includes\\Doom_misc.cfg", "flats");
}
  
// The format interface handles the map data format
formatinterface = "DoomMapSetIO";

maplumpnames
{
  include("Includes\\Doom_misc.cfg", "doommaplumpnames");
}

// When this is set to true, sectors with the same tag will light up when a line is highlighted
linetagindicatesectors = true;

// Special linedefs
include("Includes\\ZDoom_misc.cfg", "speciallinedefs_doomhexen");

// Default flags for first new thing
defaultthingflags
{
  include("Includes\\Doom_misc.cfg", "defaultthingflags");
}

// Door making
include("Includes\\ZDoom_misc.cfg", "doormaking_doom");

// Generalized actions
generalizedlinedefs = false;
generalizedsectors = false;

staticlimits
{
  visplanes = 128;
}

visplaneexplorer
{
  viewheightdefault = 41;

  viewheights
  {
    1 = "Death";
    24 = "Falling";
    41 = "Eye level";
    96 = "Archvile jump";
  }
}

// DEFAULT SECTOR BRIGHTNESS LEVELS
sectorbrightness
{
  include("Includes\\Doom_misc.cfg", "sectorbrightness");
}

